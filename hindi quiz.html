const letters=["A","B","C","D"];
let answered=0,correct=0;
const states=new Array(data.length).fill(null);
const quiz=document.getElementById("quiz"),scoreEl=document.getElementById("score"),progressEl=document.getElementById("progress"),filterEl=document.getElementById("filter");
[...new Set(data.map(x=>x.section))].forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;filterEl.appendChild(o)});
function update(){scoreEl.innerHTML=`<strong>स्कोर: ${correct} / ${answered}</strong>`;progressEl.textContent=`120 में से ${answered} उत्तर दिए`;}
function render(){quiz.innerHTML="";const f=filterEl.value;data.forEach((item,idx)=>{if(f!=="all"&&item.section!==f)return;const card=document.createElement("section");card.className="qcard";card.innerHTML=`<div class="meta">${item.section} · प्रश्न ${idx+1}</div><div class="qtext">${item.q}</div><div class="options"></div><div class="answer"><div class="head"></div><div class="body"></div></div>`;const ops=card.querySelector(".options");item.opts.forEach((txt,oi)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<strong>${letters[oi]}.</strong> ${txt}`;b.onclick=()=>choose(idx,oi,card);ops.appendChild(b)});quiz.appendChild(card);if(states[idx]!==null)apply(idx,card)})}
function choose(idx,oi,card){if(states[idx]!==null)return;states[idx]=oi;answered++;if(oi===data[idx].correct)correct++;apply(idx,card);update();}
function apply(idx,card){const item=data[idx],sel=states[idx],btns=[...card.querySelectorAll(".opt")];btns.forEach((b,i)=>{b.disabled=true;if(i===item.correct)b.classList.add("correct");if(i===sel&&i!==item.correct)b.classList.add("wrong")});const ans=card.querySelector(".answer"),head=ans.querySelector(".head"),body=ans.querySelector(".body"),ok=sel===item.correct;ans.style.display="block";ans.classList.add(ok?"good":"bad");head.textContent=ok?"सही उत्तर":`सही उत्तर: ${letters[item.correct]}. ${item.opts[item.correct]}`;body.textContent=item.explanation;}
filterEl.onchange=render;document.getElementById("reset").onclick=()=>{states.fill(null);answered=0;correct=0;update();render();window.scrollTo({top:0,behavior:"smooth"})};update();render();
</script></body></html>
